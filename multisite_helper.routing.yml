multisite_helper.settings:
  path: '/admin/config/system/multisite-helper'
  defaults:
    _form: 'Drupal\multisite_helper\Form\MultisiteHelperSettingsForm'
    _title: 'Multisite Helper: Settings'
  requirements:
    _permission: 'administer multisite helper'

multisite_helper.plugin_settings:
  path: '/admin/config/system/multisite-helper/plugins'
  defaults:
    _form: 'Drupal\multisite_helper\Form\MultisiteHelperPluginSettingsForm'
    _title: 'Multisite Helper: Settings'
  requirements:
    _permission: 'administer multisite helper'

multisite_helper.receive:
  path: '/api/multisite-helper/sync-data/{plugin_id}'
  defaults:
    _controller: 'Drupal\multisite_helper\Controller\MultisiteHelperController::receive'
    _title: 'Receive plugin data'
  requirements:
    _custom_access: 'Drupal\multisite_helper\Controller\MultisiteHelperController::apiKeyAccess'
  methods: [PUT, POST, DELETE]

entity.mh_subsite.collection:
  path: '/admin/config/system/multisite-helper/subsites'
  defaults:
    _form: '\Drupal\multisite_helper\Form\MhSubsiteOverviewForm'
    _title: 'Multisite Helper Subsite configuration'
  requirements:
    _permission: 'administer mh_subsite'

entity.mh_subsite.add_form:
  path: '/admin/config/system/multisite-helper/subsites/add'
  defaults:
    _entity_form: 'mh_subsite.add'
    _title: 'Add a multisite helper subsite'
  requirements:
    _permission: 'administer mh_subsite'

entity.mh_subsite.edit_form:
  path: '/admin/config/system/multisite-helper/subsites/{mh_subsite}'
  defaults:
    _entity_form: 'mh_subsite.edit'
    _title: 'Edit a multisite helper subsite'
  requirements:
    _permission: 'administer mh_subsite'

entity.mh_subsite.delete_form:
  path: '/admin/config/system/multisite-helper/subsites/{mh_subsite}/delete'
  defaults:
    _entity_form: 'mh_subsite.delete'
    _title: 'Delete a multisite helper subsite'
  requirements:
    _permission: 'administer mh_subsite'
