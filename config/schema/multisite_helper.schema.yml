multisite_helper.settings:
  type: config_object
  label: 'Multisite Helper: Settings'
  mapping:
    api_key:
      type: string
      label: 'API key'
    entity_processor:
      type: string
      label: 'The entity processor'
    concurrent_calls:
      type: integer
      label: 'Number of concurrent calls'

multisite_helper.plugin.*:
  type: config_object
  label: 'Multisite Helper: Plugin settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable plugin'
    processing_method:
      type: string
      label: 'Processing method'

multisite_helper.plugin.content_entity_sync:
  type: 'multisite_helper.plugin.*'
  mapping:
    entity_types:
      type: sequence
      label: 'Entity types'

multisite_helper.mh_subsite.*:
  type: config_entity
  label: Multisite Helper Subsite
  mapping:
    id:
      type: string
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: string
    description:
      type: string
    url:
      type: string
    weight:
      type: integer
