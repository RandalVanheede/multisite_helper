services:
  _defaults:
    autowire: true
    autoconfigure: true

  multisite_helper:
    class: Drupal\multisite_helper\MultisiteHelper
  Drupal\multisite_helper\MultisiteHelperInterface: '@multisite_helper'

  # Plugin managers
  plugin.manager.multisite_helper_plugin:
    class: Drupal\multisite_helper\MultisiteHelperPluginManager
    parent: default_plugin_manager
    arguments:
      $configFactory: '@config.factory'
  Drupal\multisite_helper\MultisiteHelperPluginManager: '@plugin.manager.multisite_helper_plugin'

  plugin.manager.multisite_helper_processing_method:
    class: Drupal\multisite_helper\MultisiteHelperProcessingMethodPluginManager
    parent: default_plugin_manager
  Drupal\multisite_helper\MultisiteHelperProcessingMethodPluginManager: '@plugin.manager.multisite_helper_processing_method'

  plugin.manager.multisite_helper_entity_processor:
    class: Drupal\multisite_helper\MultisiteHelperEntityProcessorPluginManager
    parent: default_plugin_manager
  Drupal\multisite_helper\MultisiteHelperEntityProcessorPluginManager: '@plugin.manager.multisite_helper_entity_processor'

  # Event subscribers
  multisite_helper.event_subscriber.single_content_sync:
    class: Drupal\multisite_helper\EventSubscriber\SingleContentSyncEventSubscriber
