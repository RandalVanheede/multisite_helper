services:
  _defaults:
    autowire: true
    autoconfigure: true

  multisite_helper:
    class: Drupal\multisite_helper\MultisiteHelper
  Drupal\multisite_helper\MultisiteHelperInterface: '@multisite_helper'

  plugin.manager.multisite_helper_plugin:
    class: Drupal\multisite_helper\MultisiteHelperPluginManager
    parent: default_plugin_manager
    arguments:
      $configFactory: '@config.factory'
  Drupal\multisite_helper\MultisiteHelperPluginManager: '@plugin.manager.multisite_helper_plugin'

  plugin.manager.multisite_helper_execution_method:
    class: Drupal\multisite_helper\MultisiteHelperExecutionMethodPluginManager
    parent: default_plugin_manager
  Drupal\multisite_helper\MultisiteHelperExecutionMethodPluginManager: '@plugin.manager.multisite_helper_execution_method'

  Drupal\multisite_helper\Hook\FormAlter:
    class: Drupal\multisite_helper\Hook\FormAlter
    arguments:
      $contentExporter: '@single_content_sync.exporter'

  Drupal\multisite_helper\Hook\EntityHooks:
    class: Drupal\multisite_helper\Hook\EntityHooks
    arguments:
      $contentExporter: '@single_content_sync.exporter'
