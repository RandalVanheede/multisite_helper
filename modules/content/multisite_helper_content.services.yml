services:
  _defaults:
    autowire: true

  Drupal\multisite_helper_content\Hook\EntityHooks:
    class: Drupal\multisite_helper_content\Hook\EntityHooks
    arguments:
      $contentExporter: '@single_content_sync.exporter'

  Drupal\multisite_helper_content\Hook\FormAlter:
    class: Drupal\multisite_helper_content\Hook\FormAlter
    arguments:
      $contentExporter: '@single_content_sync.exporter'
